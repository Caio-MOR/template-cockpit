name: gitleaks

# Portão de segredos: todo push e toda PR passam pela varredura do histórico completo
# — o scan local continua valendo, mas deixa de depender de alguém lembrar de rodar.
# Binário pinado por versão E por checksum: baixar-e-executar sem conferir o hash é
# confiar no servidor de download com o token do repo na mão.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  segredos:
    name: varredura-de-segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo p/ varredura)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Baixar gitleaks e conferir checksum
        run: |
          curl -sSL -o gitleaks_8.24.3_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks_8.24.3_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks

      - name: Varredura de segredos (gitleaks)
        run: ./gitleaks detect --source . --no-banner --redact --verbose
