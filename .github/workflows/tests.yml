name: tests

# Gate mecânico do repo: o veredito da suíte e o lint de routers rodam em todo push
# na main e toda PR — a verificação deixa de depender de memória humana.
# Um workflow por preocupação (o de segredos é o gitleaks.yml).
#
# Por que a matriz de SO: gate que só roda num SO é gate PRESUMIDO, não verificado.
# Cada plataforma produz achado que as outras não pegam (CRLF + shebang que só quebra
# no Windows; `Path.is_absolute()` que é no-op fora dele). `gitleaks.yml` fica fora da
# matriz de propósito: varre conteúdo do histórico, não comportamento de plataforma.
#
# Matriz enxuta (herdada da PR Caio-MOR/Cakopit#14): macOS custa 10x o minuto do
# ubuntu, sem rodar em todo push. Ele sai deste workflow e vira `tests-macos.yml`,
# semanal — continua sendo verificado, só que não a cada commit. Em PR a matriz de
# suíte segue ubuntu+windows (o par que pega os dois bugs citados acima); em push
# direto na main (sem PR — ex.: merge de squash) só ubuntu roda, porque windows já
# rodou na PR que originou o commit. `lint-routers` é stdlib pura e independe de SO:
# uma plataforma basta.

on:
  pull_request:
    paths-ignore:
      - '.claude-memory/**'
      - 'audits/**'
      - '**/logs/**'
  push:
    branches: [main]
    paths-ignore:
      - '.claude-memory/**'
      - 'audits/**'
      - '**/logs/**'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: suite-pytest
    timeout-minutes: 15
    strategy:
      # fail-fast: false para ver os veredictos de todos os SOs da rodada.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Python (versão do .python-version)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Dependências (só requirements.txt)
        run: pip install -r requirements.txt

      # O veredito, e não `pytest -q` direto: quem julga a suíte não pode ser o
      # próprio pytest. Ele roda a guarda de conteúdo (AST), o canário e a suíte em
      # subprocessos de ambiente limpo, e só devolve 0 com os três ramos verdes.
      # Com um hook de resultado no conftest.py da raiz, `pytest -q` devolve exit 0
      # com veneno ativo.
      - name: Veredito dos gates (guarda de conteúdo + canário + suíte)
        run: python tools/gate_veredito.py

  lint-routers:
    name: lint-de-routers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # O lint é stdlib pura: não depende de SO, roda numa plataforma só.
      - name: Python (versão do .python-version)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Lint de routers (referências × índice git)
        run: python tools/lint_routers.py

      # A régua do padrão ouro, no repo-template: placeholders permitidos. No repo
      # instanciado, troque por `python tools/padrao_ouro_audit.py .` (sem --template).
      - name: Auditor do padrão ouro
        run: python tools/padrao_ouro_audit.py --tipo cockpit --template .

      # Pin exato (não a action de terceiro `ruff-action`): versão previsível,
      # sem depender de uma tag móvel de outro repo.
      - name: Instalar ruff
        run: pip install ruff==0.16.6

      - name: Lint de estilo (ruff)
        run: ruff check .
