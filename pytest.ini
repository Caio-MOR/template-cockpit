[pytest]
testpaths = tests
; xfail que passa REPROVA. Sem isto, `pytestmark = pytest.mark.xfail` num arquivo de gate
; transforma a reprovação em `xfailed` e a suíte segue verde tendo detectado a regressão.
xfail_strict = true
; NÃO existe `addopts` aqui, de propósito: um posicional em `addopts` (ex.: `addopts = .`)
; faz a rodada deixar de parecer completa para o conftest.py da raiz, o que desliga piso
; de coleta, gates obrigatórios e detector de filtro de uma vez.
